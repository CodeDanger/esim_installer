name: esim_installer
description: "A Flutter plugin to install eSIM on Android and open provisioning URL on iOS for easy setup."
version: 0.0.3
homepage: https://github.com/CodeDanger/esim_installer

environment:
  sdk: ^3.7.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.esim.installer
        pluginClass: EsimInstallerPlugin
      ios:
        pluginClass: EsimInstallerPlugin
